apply plugin: 'java-library'

// Tiny bridge module: the only place where the workspace contract meets PF4J. It contains exactly the
// PF4J ExtensionPoint, keeping :agent-workspace-api completely PF4J-free. Provided by the host classloader
// at runtime; plugins depend on it as `compileOnly`.
dependencies {
    api project(':agent-workspace-api')
    // PF4J 3.15.0 verified Java 8 bytecode (major 52). Pinned exactly — no ranges, no latest.release.
    api 'org.pf4j:pf4j:3.15.0'

    testImplementation 'junit:junit:4.13.2'
}

test {
    useJUnit()
}
