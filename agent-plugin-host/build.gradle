apply plugin: 'java-library'

// The PF4J-backed plugin host: catalog, compatibility checks, workspace lifecycle, generic workspace host,
// mode selector, plugin state/error handling. Contains NO research-specific classes.
dependencies {
    api project(':agent-workspace-api')
    api project(':agent-plugin-pf4j-api')
    implementation 'org.pf4j:pf4j:3.15.0'

    testImplementation 'junit:junit:4.13.2'
}

test {
    useJUnit()
    // The classloader integration test must load the research plugin from a real plugin directory, NOT from
    // the test classpath. We hand it the freshly built plugin JAR's path via a system property; the plugin is
    // deliberately NOT a dependency of this module.
    dependsOn ':research-agent-ui-plugin:pluginJar'
    doFirst {
        def pluginJarTask = project(':research-agent-ui-plugin').tasks.getByName('pluginJar')
        systemProperty 'research.plugin.jar', pluginJarTask.archiveFile.get().asFile.absolutePath
    }
}
