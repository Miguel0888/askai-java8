// ACP adapter: the ONLY module that sees acp-sdk/Reactor types. Implements the neutral :acp-client-api port.
apply plugin: 'java-library'
dependencies {
    api project(':acp-client-api')
    implementation 'org.noear:acp-sdk:3.10.1'
    testImplementation 'junit:junit:4.13.2'
}
test {
    useJUnit()
    // The round-trip test spawns the demo agent jar as a real child process.
    dependsOn ':acp-demo-agent:demoAgentJar'
    doFirst {
        def t = project(':acp-demo-agent').tasks.getByName('demoAgentJar')
        systemProperty 'acp.demo.agent.jar', t.archiveFile.get().asFile.absolutePath
        systemProperty 'acp.java8.home', System.getProperty('java.home')
    }
}
