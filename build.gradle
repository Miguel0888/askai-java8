allprojects {
    group = 'com.aresstack.askai.java8'
    version = (findProperty('releaseVersion') ?: '0.1.0').toString()

    repositories {
        // DEV (local-engine slice): the neutral win-directml model catalog is consumed as
        // com.aresstack:directml-model-catalog:0.1.0-SNAPSHOT from mavenLocal while it is being built in
        // the sibling win-directml-java repo. Development state: 0.1.0-SNAPSHOT via mavenLocal.
        // Merge/release state: a fixed published Maven Central version (pinned in C5, before any ff-merge).
        // Restrict mavenLocal to the AresStack group so a stray local artifact of another group can never
        // silently shadow a Central dependency.
        mavenLocal {
            content {
                includeGroup 'com.aresstack'
            }
        }
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'

    // The DELIBERATE Java-21 sidecar processes: the browser MCP sidecar (playwright4j is major 65)
    // and the local model runtime (win-directml-java is Java 21). Everything else stays strictly
    // Java 8; the Java-8 host never compiles against or loads sidecar classes.
    def java21Modules = [
            'browser-mcp-server-java21',
            'local-model-runtime-sidecar-java21'
    ]
    if (!(name in java21Modules)) {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
    }
}
