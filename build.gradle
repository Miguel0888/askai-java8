allprojects {
    group = 'com.aresstack.askai.java8'
    version = (findProperty('releaseVersion') ?: '0.1.0').toString()

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'

    // The browser MCP sidecar is the one deliberate Java-21 process (playwright4j is major 65). Everything
    // else stays strictly Java 8; the Java-8 host never compiles against or loads sidecar classes.
    if (name != 'browser-mcp-server-java21') {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
    }
}
